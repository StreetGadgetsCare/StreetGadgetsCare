    ["Tecno Camon 40 Pro 5G Battery","tecno-camon-40-pro-5g-battery.jpg"],
    ["Tecno Spark 4 Pro Battery","tecno-spark-4-pro-battery.jpg"],
    ["Tecno Spark 5 Battery","tecno-spark-5-battery.jpg"],
    ["Tecno Spark 7 Battery","tecno-spark-7-battery.jpg"],
    ["Tecno Spark 7P Battery","tecno-spark-7p-battery.jpg"],
    ["Tecno Spark 7 Battery","tecno-spark-7-battery.jpg"]
  ]]
];

const brandOrder = ["iPhone","Samsung","Redmi / Xiaomi","Google Pixel","Infinix","Tecno","itel"];
const brandMap = new Map(brandOrder.map(name => [name, []]));

function addPart(brand, model, type, image) {
  if (!brandMap.has(brand)) brandMap.set(brand, []);
  brandMap.get(brand).push({model, type, image});
}

iphoneParts.forEach(([model,type,image]) => {
  const normalType = type === "Screen" ? "Screen replacement"
    : type === "Battery" ? "Battery replacement"
    : type === "Charging system" ? "Charging system replacement"
    : type === "Back cover" ? "Back cover replacement"
    : type;
  addPart("iPhone", model, normalType, image);
});

screenBrands.forEach(([brand,models]) => {
  models.forEach(([model,image]) => addPart(brand, model, "Screen replacement", image));
});

replacementBrands.forEach(([brand,parts]) => {
  parts.forEach(([model,type,image]) => addPart(brand, model, type, image));
});

batteryBrands.forEach((brandEntry) => {
  const models = brandEntry[1];
  models.forEach(([name,image]) => {
    const model = name.replace(/\s+Battery$/i,"");
    addPart("Tecno", model, "Battery replacement", image);
  });
});

/* Add each model/part combination once, while retaining different parts for the same model. */
const descriptionSets = {
  "Screen replacement": [
    model => `A damaged display can make your ${model} difficult to use. This screen replacement listing helps you find a model-matched display, with panel quality and touch compatibility confirmed before fitting.`,
    model => `Bring everyday viewing and touch use back to your ${model}. Ask about the compatible screen assembly and compare the available display options for this exact model.`,
    model => `Cracks, lines or an unresponsive display can interrupt the use of your ${model}. We can help identify the correct replacement screen and confirm the available quality and fitting cost.`,
    model => `Choose a screen specifically checked for your ${model}. Ask about the correct display assembly, available quality options and fitting cost.`
  ],
  "Battery replacement": [
    model => `If your ${model} struggles to hold charge, ask about a battery matched to the exact device version. We will help confirm compatibility, available quality options and replacement cost.`,
    model => `Support more dependable everyday power on your ${model} with a compatible battery replacement. Confirm the correct battery specification and fitting options with our team.`,
    model => `Frequent charging or unexpected power loss may indicate a battery issue on your ${model}. Enquire about the suitable replacement and confirm the part details before installation.`,
    model => `A battery replacement for the ${model} should match the correct model and connector. Ask us to verify the part, available quality options and total replacement price.`
  ],
  "Charging system replacement": [
    model => `Restore a more dependable charging connection on your ${model} with a compatible charging-system replacement. We can help check the correct assembly and confirm the fitting cost.`,
    model => `If your ${model} charges intermittently or the cable connection feels loose, ask about this charging-system part. Compatibility and available replacement options can be confirmed before fitting.`,
    model => `A faulty charging port can interrupt daily use of your ${model}. Enquire about the model-matched charging system and confirm the part specification and replacement price.`,
    model => `Keep your ${model} ready for everyday use with a charging-system replacement selected for the correct model version. Ask us to verify compatibility and availability.`
  ],
  "Back cover replacement": [
    model => `Refresh the rear finish of your ${model} with a compatible replacement back cover. Ask about the available colour and finish options, fit and replacement cost.`,
    model => `A cracked or worn rear cover can take away from the look of your ${model}. Enquire about a model-matched replacement and confirm the available finish before ordering.`,
    model => `Give your ${model} a cleaner exterior with a replacement back cover designed for the correct model. Contact us to check compatibility, colour options and fitting.`,
    model => `For a damaged or loose rear cover on your ${model}, ask about the suitable replacement and available finish. We will help confirm the correct fit.`
  ],
  "Back glass cover replacement": [
    model => `Restore the rear appearance of your ${model} with a compatible back-glass replacement. Ask us to confirm the correct glass, available finish and fitting cost.`,
    model => `Cracked rear glass can affect the finish of your ${model}. Enquire about a replacement matched to the exact model and check the available options before repair.`,
    model => `Give your ${model} a refreshed rear finish with a suitable back-glass replacement. We can help verify compatibility and explain the available fitting options.`,
    model => `A precise model match matters when replacing the rear glass on your ${model}. Contact us to confirm the correct part and replacement price.`
  ]
};

function getDescription(model,type) {
  const options = descriptionSets[type] || [
    device => `Ask Street Gadgets Care about a compatible ${type.toLowerCase()} for your ${device}. We will help confirm the correct part, available quality options and replacement cost.`
  ];
  let hash = 0;
  for (let i=0;i<model.length;i++) hash = (hash * 31 + model.charCodeAt(i)) >>> 0;
  const partHash = type.split("").reduce((sum,char)=>sum+char.charCodeAt(0),0);
  return options[(hash + partHash) % options.length](model);
}

function whatsappLink(message) {
  return WHATSAPP_BASE + encodeURIComponent(message);
}

function createPartCard(item) {
  const card = document.createElement("article");
  card.className = "part-card";

  const imageWrap = document.createElement("div");
  imageWrap.className = "part-image";

  const img = document.createElement("img");
  img.src = item.image;
  img.alt = `${item.model} ${item.type} spare part`;
  img.loading = "lazy";
  img.decoding = "async";
  img.onerror = function () {
    this.style.display = "none";
    const fallback = document.createElement("div");
    fallback.className = "empty-image";
    fallback.textContent = "Image file: " + item.image;
    imageWrap.appendChild(fallback);
  };
  imageWrap.appendChild(img);

  const info = document.createElement("div");
  info.className = "part-info";

  const label = document.createElement("span");
  label.className = "part-label";
  label.textContent = item.type;

  const title = document.createElement("h3");
  title.textContent = item.model + " " + item.type;

  const description = document.createElement("p");
  description.className = "part-description";
  description.textContent = getDescription(item.model,item.type);

  const meta = document.createElement("div");
  meta.className = "part-meta";
  const quality = document.createElement("span");
  quality.innerHTML = "<strong>Quality options:</strong> Enquire";
  const price = document.createElement("span");
  price.innerHTML = "<strong>Price:</strong> On enquiry";
  meta.append(quality,price);

  const button = document.createElement("a");
  button.className = "btn";
  button.href = whatsappLink(`Hello Street Gadgets Care, I am interested in the ${item.type} for ${item.model}. Please confirm compatibility, available quality options and the total replacement price.`);
  button.target = "_blank";
  button.rel = "noopener noreferrer";
  button.textContent = "Enquire on WhatsApp";

  info.append(label,title,description,meta,button);
  card.append(imageWrap,info);
  return card;
}

function renderCatalogue() {
  const nav = document.getElementById("brandNav");
  const root = document.getElementById("brandCatalogues");

  brandOrder.forEach((brand,index) => {
    const rawParts = brandMap.get(brand) || [];
    const seen = new Set();
    const parts = rawParts.filter(item => {
      const key = item.model.toLowerCase() + "|" + item.type.toLowerCase() + "|" + item.image.toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    if (!parts.length) return;

    const sectionId = "brand-" + (index + 1);
    const link = document.createElement("a");
    link.href = "#" + sectionId;
    link.textContent = brand;
    nav.appendChild(link);

    const section = document.createElement("section");
    section.className = "brand-section";
    section.id = sectionId;

    const heading = document.createElement("div");
    heading.className = "brand-heading";

    const title = document.createElement("h2");
    title.textContent = brand;

    const count = document.createElement("span");
    count.textContent = parts.length + (parts.length === 1 ? " listed part" : " listed parts");

    const grid = document.createElement("div");
    grid.className = "parts-grid";

    parts.forEach(item => grid.appendChild(createPartCard(item)));

    heading.append(title,count);
    section.append(heading,grid);
    root.appendChild(section);
  });
}

renderCatalogue();

const menuToggle = document.getElementById("menuToggle");
const navigation = document.getElementById("mainNavigation");

menuToggle.addEventListener("click",() => {
  const isOpen = navigation.classList.toggle("open");
  menuToggle.setAttribute("aria-expanded",String(isOpen));
  menuToggle.setAttribute("aria-label",isOpen ? "Close navigation menu" : "Open navigation menu");
});

navigation.querySelectorAll("a").forEach(link => {
  link.addEventListener("click",() => {
    navigation.classList.remove("open");
    menuToggle.setAttribute("aria-expanded","false");
    menuToggle.setAttribute("aria-label","Open navigation menu");
  });
});

document.addEventListener("keydown",event => {
  if (event.key === "Escape") {
    navigation.classList.remove("open");
    menuToggle.setAttribute("aria-expanded","false");
    menuToggle.setAttribute("aria-label","Open navigation menu");
  }
});
