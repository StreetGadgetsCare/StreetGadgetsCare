<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Street Gadgets Care</title>
  <meta name="description" content="Shop laptops, phones, chargers, cables, storage, phone protection, laptop accessories and useful gadgets from Street Gadgets Care in Nairobi and across Kenya.">
  <meta name="keywords" content="laptops Nairobi, phones Nairobi, laptop accessories Kenya, phone accessories Nairobi, SSD Kenya, RAM Kenya, laptop bags Nairobi, chargers Nairobi, Street Gadgets Care">
  <meta name="theme-color" content="#0b1220">

  <style>
    :root {
      --navy: #0b1220;
      --navy-2: #111d30;
      --navy-3: #17243a;
      --cyan: #19a7ce;
      --cyan-dark: #087fa3;
      --cyan-light: #eaf9fd;
      --green: #25d366;
      --white: #ffffff;
      --light: #f6f9fb;
      --light-2: #eef4f7;
      --text: #101b2b;
      --muted: #667484;
      --border: #dfe7ed;
      --shadow-sm: 0 8px 24px rgba(11, 18, 32, 0.07);
      --shadow: 0 16px 40px rgba(11, 18, 32, 0.10);
      --shadow-lg: 0 25px 65px rgba(11, 18, 32, 0.15);
      --radius: 20px;
      --radius-sm: 14px;
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--white);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: min(var(--max), calc(100% - 40px));
      margin: 0 auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 2000;
      background: rgba(11, 18, 32, 0.97);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(14px);
    }

    .header-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand img {
      width: 168px;
      height: auto;
      object-fit: contain;
    }

    .main-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .main-nav a {
      color: rgba(255,255,255,0.86);
      font-size: 14px;
      font-weight: 700;
      padding: 10px 11px;
      border-radius: 10px;
      transition: 0.25s ease;
      white-space: nowrap;
    }

    .main-nav a:hover,
    .main-nav a.active {
      color: #ffffff;
      background: rgba(255,255,255,0.08);
    }

    .main-nav .nav-whatsapp {
      color: #ffffff;
      background: var(--green);
      margin-left: 7px;
      padding: 10px 15px;
    }

    .main-nav .nav-whatsapp:hover {
      background: #20bd5b;
      transform: translateY(-1px);
    }

    .menu-toggle {
      display: none;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
    }

    .menu-toggle span {
      width: 21px;
      height: 2px;
      border-radius: 10px;
      background: #ffffff;
      transition: 0.25s ease;
    }

    .menu-toggle.active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .menu-toggle.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    .category-wrap {
      position: sticky;
      top: 76px;
      z-index: 1500;
      overflow: hidden;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(11,18,32,0.04);
    }

    .category-fade-left,
    .category-fade-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 55px;
      z-index: 4;
      pointer-events: none;
    }

    .category-fade-left {
      left: 0;
      background: linear-gradient(to right, #ffffff, rgba(255,255,255,0));
    }

    .category-fade-right {
      right: 0;
      background: linear-gradient(to left, #ffffff, rgba(255,255,255,0));
    }

    .category-track {
      display: flex;
      width: max-content;
      animation: categoryScroll 42s linear infinite;
    }

    .category-set {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 8px;
    }

    .category-wrap:hover .category-track,
    .category-wrap:focus-within .category-track,
    .category-wrap.paused .category-track {
      animation-play-state: paused;
    }

    .category-link {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #ffffff;
      color: #465466;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      transition: 0.25s ease;
    }

    .category-link:hover {
      color: var(--cyan-dark);
      border-color: rgba(25,167,206,0.45);
      background: var(--cyan-light);
    }

    .category-link.active {
      color: #ffffff;
      border-color: var(--navy);
      background: var(--navy);
    }

    @keyframes categoryScroll {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    .hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 85% 20%, rgba(25,167,206,0.18), transparent 28%),
        radial-gradient(circle at 10% 90%, rgba(25,167,206,0.08), transparent 28%),
        linear-gradient(135deg, #f8fbfd 0%, #edf6f9 100%);
      padding: 82px 0 78px;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      border: 1px solid rgba(25,167,206,0.08);
      right: -220px;
      top: -220px;
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      align-items: center;
      gap: 65px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--cyan-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 17px;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      background: var(--cyan);
      border-radius: 10px;
    }

    .hero h1 {
      max-width: 700px;
      color: var(--navy);
      font-size: clamp(42px, 5vw, 68px);
      line-height: 1.02;
      letter-spacing: -2.5px;
      margin-bottom: 22px;
    }

    .hero h1 span {
      color: var(--cyan-dark);
    }

    .hero-text {
      max-width: 630px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 50px;
      padding: 13px 21px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      transition: 0.25s ease;
      border: 1px solid transparent;
    }

    .btn-primary {
      color: #ffffff;
      background: var(--navy);
      box-shadow: 0 10px 24px rgba(11,18,32,0.16);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      background: #162238;
      box-shadow: 0 14px 30px rgba(11,18,32,0.20);
    }

    .btn-whatsapp {
      color: #ffffff;
      background: var(--green);
      box-shadow: 0 10px 24px rgba(37,211,102,0.18);
    }

    .btn-whatsapp:hover {
      transform: translateY(-2px);
      background: #20bd5b;
    }

    .btn-outline {
      color: var(--navy);
      border-color: var(--border);
      background: #ffffff;
    }

    .btn-outline:hover {
      border-color: var(--cyan);
      color: var(--cyan-dark);
      transform: translateY(-2px);
    }

    .hero-trust {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hero-trust span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #526171;
      font-size: 12px;
      font-weight: 700;
    }

    .hero-trust span::before {
      content: "✓";
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      color: var(--cyan-dark);
      background: var(--cyan-light);
      font-size: 11px;
      font-weight: 900;
    }

    .hero-visual {
      position: relative;
    }

    .hero-image-card {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background: #ffffff;
      padding: 12px;
      box-shadow: var(--shadow-lg);
      transform: rotate(1deg);
    }

    .hero-image-card::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 21px;
      border: 1px solid rgba(255,255,255,0.8);
      pointer-events: none;
    }

    .hero-image-card img {
      width: 100%;
      aspect-ratio: 1 / 0.78;
      object-fit: cover;
      object-position: center;
      border-radius: 20px;
    }
