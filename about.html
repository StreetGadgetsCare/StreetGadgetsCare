<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About Us | Street Gadgets Care</title>

    <meta name="description" content="Learn about Street Gadgets Care, a Nairobi-based technology, repair, creative design and digital solutions business serving customers across Kenya.">

    <link rel="icon" type="image/png" href="Logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --navy: #0b1220;
            --navy-2: #101a2d;
            --cyan: #19a7ce;
            --cyan-dark: #1188aa;
            --white: #ffffff;
            --light: #f5f8fb;
            --text: #172033;
            --muted: #667085;
            --border: #e7edf3;
            --whatsapp: #25d366;
            --shadow: 0 18px 45px rgba(11, 18, 32, 0.09);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", sans-serif;
            color: var(--text);
            background: var(--white);
            line-height: 1.7;
        }

        img {
            max-width: 100%;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            width: min(1180px, 92%);
            margin: auto;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: rgba(11, 18, 32, 0.97);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .nav {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .logo img {
            width: 155px;
            height: auto;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 26px;
        }

        .nav-links a {
            color: #dbe4ee;
            font-size: 14px;
            font-weight: 600;
            transition: 0.25s ease;
            position: relative;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--cyan);
        }

        .nav-links a.active::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -9px;
            width: 100%;
            height: 2px;
            background: var(--cyan);
            border-radius: 10px;
        }

        .nav-cta {
            background: var(--cyan);
            color: white !important;
            padding: 11px 18px;
            border-radius: 8px;
        }

        .nav-cta:hover {
            background: var(--cyan-dark);
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            background:
                radial-gradient(circle at 80% 25%, rgba(25,167,206,0.16), transparent 30%),
                linear-gradient(135deg, #0b1220 0%, #101a2d 55%, #0c1727 100%);
            color: white;
            padding: 105px 0 95px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 430px;
            height: 430px;
            border: 1px solid rgba(25,167,206,0.12);
            border-radius: 50%;
            right: -160px;
            top: -150px;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 50%;
            left: -120px;
            bottom: -120px;
        }

        .hero-content {
            max-width: 850px;
            position: relative;
            z-index: 2;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: var(--cyan);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .eyebrow::before {
            content: "";
            width: 30px;
            height: 2px;
            background: var(--cyan);
        }

        .hero h1 {
            font-family: "Manrope", sans-serif;
            font-size: clamp(42px, 6vw, 72px);
            line-height: 1.08;
            letter-spacing: -2px;
            margin-bottom: 25px;
        }

        .hero h1 span {
            color: var(--cyan);
        }

        .hero p {
            max-width: 720px;
            color: #c5d0dc;
            font-size: 18px;
            line-height: 1.8;
        }

        .hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 32px;
        }

        .meta-item {
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            padding: 9px 15px;
            border-radius: 30px;
            color: #d9e2eb;
            font-size: 13px;
        }

        /* =========================
           INTRO
        ========================= */

        .intro {
            padding: 95px 0;
        }

        .intro-grid {
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            gap: 75px;
            align-items: start;
        }

        .section-label {
            color: var(--cyan);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.7px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .intro h2,
        .section-heading h2 {
            font-family: "Manrope", sans-serif;
            font-size: clamp(32px, 4vw, 48px);
            line-height: 1.15;
            letter-spacing: -1px;
            color: var(--navy);
        }

        .intro-text p {
            color: var(--muted);
            font-size: 16px;
            margin-bottom: 20px;
        }

        .intro-text p:last-child {
            margin-bottom: 0;
        }

        /* =========================
           STORY
        ========================= */

        .story {
            background: var(--light);
            padding: 100px 0;
        }

        .story-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
            align-items: center;
        }

        .story-copy h2 {
            font-family: "Manrope", sans-serif;
            font-size: clamp(34px, 4vw, 50px);
            line-height: 1.15;
            margin-bottom: 24px;
            color: var(--navy);
        }

        .story-copy p {
            color: var(--muted);
            margin-bottom: 18px;
        }

        .story-highlight {
            border-left: 4px solid var(--cyan);
            padding: 18px 0 18px 22px;
            margin-top: 30px;
            font-family: "Manrope", sans-serif;
            font-size: 21px;
            line-height: 1.5;
            font-weight: 700;
            color: var(--navy);
        }

        .story-panel {
            background: var(--navy);
            border-radius: 22px;
            padding: 42px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .story-panel::after {
            content: "";
            position: absolute;
            width: 230px;
            height: 230px;
            border: 1px solid rgba(25,167,206,0.25);
            border-radius: 50%;
            right: -90px;
            top: -80px;
        }

        .story-panel small {
            color: var(--cyan);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .story-panel h3 {
            font-family: "Manrope", sans-serif;
            font-size: 31px;
            line-height: 1.25;
            margin: 18px 0;
            position: relative;
            z-index: 2;
        }

        .story-panel p {
            color: #bfcbd7;
            position: relative;
            z-index: 2;
        }

        /* =========================
           WHAT WE ARE
        ========================= */

        .identity {
            padding: 100px 0;
        }

        .section-heading {
            max-width: 720px;
            margin-bottom: 50px;
        }

        .section-heading p {
            margin-top: 18px;
            color: var(--muted);
        }

        .identity-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .identity-card {
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 32px;
            background: white;
            transition: 0.3s ease;
        }

        .identity-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow);
            border-color: rgba(25,167,206,0.25);
        }

        .card-number {
            color: var(--cyan);
            font-family: "Manrope", sans-serif;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 24px;
        }

        .identity-icon {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: #eaf8fc;
            color: var(--cyan);
            font-size: 21px;
            margin-bottom: 23px;
        }

        .identity-card h3 {
            font-family: "Manrope", sans-serif;
            font-size: 22px;
            margin-bottom: 12px;
            color: var(--navy);
        }

        .identity-card p {
            color: var(--muted);
            font-size: 14px;
        }

        /* =========================
           APPROACH
        ========================= */

        .approach {
            background: var(--navy);
            padding: 100px 0;
            color: white;
        }

        .approach-grid {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 70px;
            align-items: start;
        }

        .approach h2 {
            font-family: "Manrope", sans-serif;
            font-size: clamp(34px, 4vw, 50px);
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .approach-intro {
            color: #bdc9d5;
            max-width: 520px;
        }

        .principles {
            display: grid;
            gap: 18px;
        }

        .principle {
            display: grid;
            grid-template-columns: 54px 1fr;
            gap: 18px;
            padding: 22px 0;
            border-bottom: 1px solid rgba(255,255,255,0.09);
        }

        .principle:last-child {
            border-bottom: none;
        }

        .principle-number {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid rgba(25,167,206,0.45);
            display: grid;
            place-items: center;
            color: var(--cyan);
            font-weight: 800;
            font-size: 13px;
        }

        .principle h3 {
            font-family: "Manrope", sans-serif;
            font-size: 19px;
            margin-bottom: 5px;
        }

        .principle p {
            color: #aebbc8;
            font-size: 14px;
        }

        /* =========================
           VALUES
        ========================= */

        .values {
            padding: 100px 0;
        }

        .values-header {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 55px;
        }

        .values-header p {
            color: var(--muted);
            margin-top: 16px;
        }

        .values-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .value {
